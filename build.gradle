plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.codit'
version = '0.0.1-SNAPSHOT'
description = 'BODA_PROTOTYPE'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring AI BOM
    implementation platform('org.springframework.ai:spring-ai-bom:1.0.0')

    // Web (Spring Boot 3.x 표준 이름)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Spring AI - OpenAI (ChatModel + EmbeddingModel)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // Spring AI - Vector Store (SimpleVectorStore, SearchRequest)
    implementation 'org.springframework.ai:spring-ai-vector-store:1.0.0'

    // Apache PDFBox 3.x
    implementation 'org.apache.pdfbox:pdfbox:3.0.2'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Dev tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // DB - RDS (PostgreSQL) + JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
